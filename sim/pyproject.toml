[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riscq_sim"
version = "0.1.0"
description = "Co-simulation of the riscq PulseTableSoc: Verilator + cocotb bench behind the same driver seam as the board"
requires-python = ">=3.10,<3.14"
dependencies = ["riscq", "numpy", "Pyro5", "serpent", "cocotb==1.9.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["riscq_sim*"]
